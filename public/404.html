<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Page not found — Korabi Travel</title>
<meta name="description" content="That page isn't on our map. Head back to search flights or browse the seat marketplace."/>
<meta name="theme-color" content="#FFF7EE"/>
<link rel="icon" href="/assets/korabi-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<style>
.notfound{
  min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;
  padding:48px 24px;text-align:center;
  background:radial-gradient(ellipse 70% 50% at 50% 0%,var(--sky) 0%,transparent 55%),var(--paper);
}
.notfound-inner{max-width:440px;}
.notfound .code{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--coral-deep);margin-bottom:12px;
}
.notfound h1{font-size:clamp(2rem,5vw,2.6rem);margin-bottom:10px;}
.notfound p{color:var(--ink-soft);font-size:1.02rem;margin:0 0 28px;}
.notfound .acts{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.topo404{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.35;}
.topo404 path{fill:none;stroke:var(--teal);stroke-width:1.5;opacity:.12;}
</style>
</head>
<body>
<header class="nav"><div class="wrap nav-inner">
  <a class="brand" href="/"><img class="mark" src="/assets/korabi-mark.svg" alt=""> korabi</a>
  <div class="nav-right">
    <a href="/" class="muted" style="font-size:.92rem;">Search flights</a>
    <a href="/marketplace" class="muted" style="font-size:.92rem;">Marketplace</a>
  </div>
</div></header>

<main class="notfound" style="position:relative;">
  <svg class="topo404" viewBox="0 0 800 400" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M200 400 C 350 380 350 220 400 120 C 450 220 450 380 600 400"/>
    <path d="M80 400 C 280 380 280 240 400 160 C 520 240 520 380 720 400"/>
  </svg>
  <div class="notfound-inner reveal visible">
    <p class="code">404 · off the map</p>
    <h1>This route doesn't exist</h1>
    <p>The page you're looking for may have moved, or the URL might be mistyped. Let's get you back on course.</p>
    <div class="acts">
      <a href="/" class="btn btn-primary">Search flights</a>
      <a href="/marketplace" class="btn btn-ghost">Seat marketplace</a>
    </div>
  </div>
</main>
<script src="/assets/site.js"></script>
<div id="korabiFooter"></div>
</body>
</html>
